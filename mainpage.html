<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MrkiSweeper</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    
    <body>
        <!-- Zgornje območje glave -->
        <header class="header">
            <div class="header-container">
                <img class="logo" src="photos/logo.svg" alt="Site Logo">
                <img id="headerProfilePic" class="profile-pic clickable" src="photos/default_pfp.png" alt="Profile Picture" onclick="window.location.href='profile.html'">
            </div>
        </header>

        <!-- Glavno vsebinsko okno, kjer se prikažejo razdelek lestvice ali igranja -->
        <main class="main-content">
            <div id="background-animation" class="background-animation"></div>
            <div class="content-wrapper">
                <div id="leaderboard-section" class="content-section leaderboard-section">
                    <div class="leaderboard-search-bar">
                        <div class="leaderboard-search">
                            <input id="playerSearchInput" type="text" placeholder="Enter username to search" />
                            <button id="playerSearchBtn" type="button">Search</button>
                        </div>
                    </div>

                    <div class="leaderboard-group global-leaderboard">
                        <h2>Global Leaderboard</h2>
                        <table class="leaderboard-table">
                            <thead>
                                <tr>
                                    <th>Rank</th>
                                    <th>Player</th>
                                    <th>Time (s)</th>
                                </tr>
                            </thead>
                            <tbody id="leaderboardBody">
                                <!-- dynamic rows inserted by JS -->
                            </tbody>
                        </table>
                    </div>

                    <div class="leaderboard-group player-scores">
                        <h2>Player Scores</h2>
                        <table class="leaderboard-table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Player</th>
                                    <th>Time (s)</th>
                                </tr>
                            </thead>
                            <tbody id="searchResultsBody">
                                <tr><td colspan="3">Your scores will appear here by default.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div id="play-section" class="content-section play-section">
                    <h2>Ready to Play?</h2>
                    <button class="play-btn" onclick="window.location.href='minesweeper.html'">PLAY</button>
                </div>
            </div>
        </main>
        
        <script src="js/config.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/main.js"></script>
    </body>
</html>
